spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 500
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

amaazon:
  jwt:
    secret-key: test-secret-key-test-secret-key-test-secret-key-test-secret-key
    access-expiration: 30m
    guest-expiration: 10m
    refresh-expiration: 7d
    refresh:
      cookie:
        name: REFRESH_TOKEN
        path: /
        same-site: Lax
        secure: false
  cache:
    type: caffeine
    capacity: 5000
  login:
    max-attempt: 5
    locked-duration: 30m

logging:
  level:
    root: INFO
    io.github.metdaisy.amaazon: info

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 500
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init_schema.sql

amaazon:
  jwt:
    secret-key: test-secret-key-test-secret-key-test-secret-key-test-secret-key
    access-expiration: 30m
    guest-expiration: 10m
    refresh-expiration: 7d
    refresh:
      cookie:
        name: REFRESH_TOKEN
        path: /
        same-site: Lax
        secure: false
  cache:
    type: caffeine
    capacity: 5000

logging:
  level:
    root: INFO
    io.github.metdaisy.amaazon: info

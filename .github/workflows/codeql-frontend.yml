name: "CodeQL Advanced (Frontend)"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    paths:
      - 'amaazon-front/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'amaazon-front/**'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    # CodeQL 분석 도구 초기화
    - name: Initialize CodeQL
      uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
      with:
        languages: javascript-typescript
        build-mode: none
        queries: security-and-quality

    # CodeQL 분석 수행 및 GitHub Security 탭에 결과 업로드
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
      with:
        category: "/language:javascript-typescript"

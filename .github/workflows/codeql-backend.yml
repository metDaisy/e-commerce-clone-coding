name: "CodeQL Advanced (Backend)"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      - '.github/workflows/codeql-backend.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      - '.github/workflows/codeql-backend.yml'

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    # CodeQL 분석 도구 초기화
    - name: Initialize CodeQL
      uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
      with:
        languages: java-kotlin
        build-mode: manual
        queries: security-and-quality

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle
      run: ./gradlew build -x test

    # CodeQL 분석 수행 및 GitHub Security 탭에 결과 업로드
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38
      with:
        category: "/language:java-kotlin"

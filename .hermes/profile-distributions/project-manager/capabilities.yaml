# Project Manager capability policy distributed with this Profile.
# No endpoints, credentials, sessions, state databases, or machine paths.
profile: project-manager

skills:
  allowed:
    - hermes-agent
    - write-task
    - cross-domain-contract-planning
    - codebase-inspection
    - github
    - systematic-debugging

plugins:
  enabled:
    - agent-audit

tools:
  allowed_toolsets:
    - terminal
    - file
    - skills
    - clarify
    - kanban

approvals:
  mode: smart

stt:
  enabled: false

mcp_tools:
  codebase_project_manager:
    include:
      - index_status
      - search_graph
      - trace_path

  github_project_manager:
    include:
      - add_issue_comment
      - add_reply_to_pull_request_comment
      - create_pull_request
      - issue_read
      - issue_write
      - list_issues
      - list_pull_requests
      - merge_pull_request
      - pull_request_read
      - search_issues
      - search_pull_requests
      - update_pull_request

mcp:
  allowed_servers:
    - semble-mcp
    - codebase-memory
    - github-mcp
  filters:
    codebase-memory: codebase_project_manager
    github-mcp: github_project_manager
    semble-mcp: semble_read

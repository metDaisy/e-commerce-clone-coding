# Project Manager capability policy distributed with this Profile.
# No endpoints, credentials, sessions, state databases, or machine paths.
profile: project-manager

skills:
  allowed:
    - hermes-agent
    # Planned distribution-owned PM Skills. The policy becomes applicable after
    # each corresponding Skill is added to this Distribution.
    - service-planning
    - create-triage
    - build-task-graph
    - controll-task-graph
    - sync-docs
    - update-current-state
    # Retained for PM-focused documentation search; its content will be revised.
    - semble-search

plugins:
  enabled:
    - agent-audit

tools:
  allowed_toolsets:
    - terminal
    - file
    - skills
    - clarify
    - kanban
    # Research, deterministic planning drafts, and PM session continuity.
    - web
    - browser
    - code_execution
    - todo
    - memory
    - session_search

approvals:
  mode: smart

stt:
  enabled: false

mcp_tools:
  github_project_manager:
    include:
      - add_issue_comment
      - add_reply_to_pull_request_comment
      - create_pull_request
      - issue_read
      - issue_write
      - list_issues
      - list_pull_requests
      - merge_pull_request
      - pull_request_read
      - search_issues
      - search_pull_requests
      - update_pull_request

mcp:
  allowed_servers:
    - codebase-memory-mcp
    - semble-mcp
    - github-mcp
  filters:
    github-mcp: github_project_manager
    semble-mcp: semble_read
